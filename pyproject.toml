[tool.poetry]
name = "ace-of-clust"
version = "0.3.0"
description = "ACE-OF-Clust: Alignment, Comparison, and Evaluation of Omics Features in Clustering"
authors = ["Xiran Liu <xiran_liu1@brown.edu>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "ace_of_clust", from = "src" }]

homepage = "https://github.com/xr-cc/ace-of-clust"
repository = "https://github.com/xr-cc/ace-of-clust"

[tool.poetry.dependencies]
python = ">=3.9,<3.12"

numpy = ">=1.21"
pandas = ">=1.5"
matplotlib = ">=3.5"
seaborn = ">=0.12"
clumppling = ">=2.0"

# optional: repels overlapping labels in some plots
adjustText = { version = ">=0.8", optional = true }

[tool.poetry.extras]
adjusttext = ["adjustText"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
ruff = ">=0.6"

# only needed to run the example notebooks
[tool.poetry.group.examples]
optional = true
[tool.poetry.group.examples.dependencies]
ipykernel = "^6.29"
jupyter = "^1.0"
notebook = "^7.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.1"
mkdocs-jupyter = "^0.25.1"
mkdocs-autorefs = "^1.4.3"
mkdocstrings = {markers = "python_version >= \"3.10\"", extras = ["python"], version = "^1.0.0"}

[tool.poetry.urls]
Documentation = "https://xr-cc.github.io/ace-of-clust/"
Repository = "https://github.com/xr-cc/ace-of-clust"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

